apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-deployment  # Matches your Jenkins rollout status command
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
      - name: netflix-app
        image: waseem09/netflix-clone:latest # Added explicit tag
        imagePullPolicy: Always # Forces pull of your newly built image
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi" # Limits RAM usage for your 3.3Gi server
            cpu: "100m"
          limits:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-service
  labels:
    app: netflix-app
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007 # Accessible at http://<Node-IP>:30007
  selector:
    app: netflix-appapiVersion: apps/v1
